services:
  - type: web
    name: frontend-stock-dashboard
    env: static
    rootDir: stock-dashboard
    buildCommand: npm run build
    staticPublishPath: ./dist        # Vite output → dist/ (pas build/)
    headers:
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-XSS-Protection
        value: 1; mode=block
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data:; connect-src 'self' https://*.onrender.com; font-src 'self' https://fonts.gstatic.com; object-src 'none'; base-uri 'self'"

  - type: web
    name: stock-analysis-api
    env: python
    rootDir: backend
    # L'extension httpfs de DuckDB (lecture de Cloudflare R2) est installée dans backend/.duckdb_extensions
    buildCommand: pip install -r requirements.txt && python -c "import duckdb; c = duckdb.connect(); c.execute(\"SET extension_directory='.duckdb_extensions'\"); c.execute('INSTALL httpfs')"
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: ALLOWED_ORIGINS
        sync: false
      # Crible des marchés sur Cloudflare R2 (remplis dans le tableau de bord Render, jamais dans le dépôt)
      - key: CRIBLE_R2_BUCKET
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
